<!doctype html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinite Jest - Beckwards</title>
  <meta name="description" content="A hidden Beckwards note." />
  <script>
    (function () {
      let unlocked = false;
      try {
        unlocked = window.sessionStorage?.getItem("beckwardsInfiniteJestUnlocked") === "true";
      } catch (_) {}
      if (!unlocked) {
        window.__beckwardsJestBlocked = true;
        location.replace(location.origin + "/digital#look-hard-enough");
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      if (window.__beckwardsJestBlocked) return;
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="jest-page">
  <main class="jest-scene" aria-label="Infinite Jest note">
    <a class="jest-home-link" href="/" aria-label="Home">
      <img src="assets/who-is-b3/house%20drawing/house%20drawing.png" alt="" aria-hidden="true" />
    </a>

    <section class="jest-paper" data-jest-paper aria-label="Infinite Jest note with hidden video">
      <div class="jest-reveal" data-jest-reveal aria-hidden="true">
        <a class="jest-youtube-link" data-jest-youtube-link href="https://www.youtube.com/watch?v=yYCz06bS380" target="_blank" rel="noopener noreferrer" aria-label="Watch the referenced video on YouTube" hidden>
          <img class="jest-youtube-link__image" src="assets/inifinite-jest-easter-egg/watch%20here.png" alt="" aria-hidden="true" />
        </a>
      </div>
      <img class="jest-scan" data-jest-scan src="assets/inifinite-jest-easter-egg/note%20fixed%20typo.webp" alt="Handwritten Beckwards Infinite Jest note" />
      <img class="jest-burn-frame" data-jest-burn-frame src="assets/inifinite-jest-easter-egg/burn/Assets/burn1.webp" alt="" aria-hidden="true" hidden />
      <button class="jest-video-hotspot" data-jest-video-hotspot type="button" aria-label="Burn the page to open the hidden YouTube video"></button>
    </section>
  </main>
  <script>
    (() => {
      const paper = document.querySelector('[data-jest-paper]');
      const hotspot = document.querySelector('[data-jest-video-hotspot]');
      const reveal = document.querySelector('[data-jest-reveal]');
      const burnFrame = document.querySelector('[data-jest-burn-frame]');
      const youtubeLink = document.querySelector('[data-jest-youtube-link]');
      if (!paper || !hotspot || !reveal || !burnFrame || !youtubeLink) return;

      const youtubeUrl = 'https://www.youtube.com/watch?v=yYCz06bS380';
      const frameRoot = 'assets/inifinite-jest-easter-egg/burn/Assets/';
      const burnFrames = Array.from({ length: 11 }, (_, index) => `${frameRoot}burn${index + 1}.webp`);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let state = 'idle';

      burnFrames.forEach((src) => {
        const image = new Image();
        image.src = src;
      });

      const finishBurn = () => {
        if (state === 'burned') return;
        state = 'burned';
        paper.classList.remove('is-burning');
        paper.classList.add('is-burned');
        reveal.removeAttribute('aria-hidden');
        hotspot.hidden = true;
        burnFrame.hidden = false;
        burnFrame.src = burnFrames[burnFrames.length - 1];
        youtubeLink.hidden = false;
        window.setTimeout(() => {
          const youtubeWindow = window.open(youtubeUrl, '_blank', 'noopener,noreferrer');
          if (youtubeWindow) youtubeWindow.opener = null;
        }, reducedMotion.matches ? 1200 : 1800);
      };

      const playBurnFrames = () => {
        if (reducedMotion.matches) {
          finishBurn();
          return;
        }

        let frameIndex = 0;
        burnFrame.hidden = false;
        burnFrame.src = burnFrames[frameIndex];

        const advanceFrame = () => {
          frameIndex += 1;
          if (frameIndex >= burnFrames.length) {
            finishBurn();
            return;
          }
          burnFrame.src = burnFrames[frameIndex];
          window.setTimeout(advanceFrame, 125);
        };

        window.setTimeout(advanceFrame, 140);
      };

      hotspot.addEventListener('click', () => {
        if (state !== 'idle') return;
        state = 'burning';
        hotspot.disabled = true;
        hotspot.setAttribute('aria-disabled', 'true');
        paper.classList.add('is-burning');
        playBurnFrames();
      });
    })();
  </script>
</body>
</html>
