<!doctype html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sticky Note - Beckwards</title>
  <meta name="description" content="Send Beckwards a custom sticky note request." />
  <script>
    (function () {
      let unlocked = false;
      try {
        unlocked = window.sessionStorage?.getItem("beckwardsStickyNoteUnlocked") === "true";
      } catch (_) {}
      if (!unlocked) {
        location.replace(location.origin + "/" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="sticky-note-page">
  <main class="sticky-note-scene" aria-label="Custom sticky note request">
    <div class="sticky-reference-frame">
      <a class="sticky-question-link" href="/" aria-label="Return home">
        <img class="sticky-question-header" src="assets/sticky-note-page/Assets%20Option%201/ask%20a%20question.png" alt="Ask a question... get a note" />
      </a>

      <form class="sticky-note-form" data-sticky-note-form>
        <img class="sticky-type-prompt" src="assets/sticky-note-page/Assets%20Option%201/type%20here.png" alt="" aria-hidden="true" />
        <label class="visually-hidden" for="sticky-note-message">Sticky note message</label>
        <input class="sticky-note-honey" data-sticky-note-honey type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <input id="sticky-note-message" class="sticky-note-input" data-sticky-note-message type="text" name="message" autocomplete="off" maxlength="180" placeholder=" " spellcheck="true" />
        <div class="sticky-note-controls">
          <span class="sticky-note-count" data-sticky-note-count>0/45 WORDS</span>
          <button class="sticky-note-submit" data-sticky-note-submit type="submit">
            <span data-sticky-note-submit-label>SEND NOTE</span><span aria-hidden="true">→</span>
          </button>
        </div>
        <p class="sticky-note-status" data-sticky-note-status role="status" aria-live="polite"></p>
      </form>

      <section class="sticky-note-examples" aria-label="Example sticky notes">
        <img class="sticky-example sticky-example--draw-label" src="assets/sticky-note-page/Assets%20Option%201/draw%20me%20a%20picture.png" alt="Draw me a picture" />
        <img class="sticky-example sticky-example--draw-note" src="assets/sticky-note-page/Assets%20Option%201/b3%20doodle.png" alt="B3000 robot drawing" />
        <img class="sticky-example sticky-example--oldest-label" src="assets/sticky-note-page/Assets%20Option%201/oldest%20song%20on%20the%20album.png" alt="Oldest song on the album?" />
        <img class="sticky-example sticky-example--oldest-note" src="assets/sticky-note-page/Assets%20Option%201/_oldest_%20note.png" alt="A note answering the oldest song question" />
        <img class="sticky-example sticky-example--drum-label" src="assets/sticky-note-page/Assets%20Option%201/drum%20recording%20process.png" alt="Drum recording process?" />
        <img class="sticky-example sticky-example--drum-note" src="assets/sticky-note-page/Assets%20Option%201/_drum_%20note.png" alt="A handwritten note about the drum recording process" />
      </section>
    </div>
  </main>
  <script src="scripts/sticky-note.js"></script>
</body>
</html>
