<!doctype html>
<html lang="en">
<head>
<base href="/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcade - Beckwards</title>
<link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
<link rel="stylesheet" href="style.css" />
<style>
  html,
  body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
    background:#2d2d2a;
  }
  body{
    overflow:hidden;
    color:#f20b06;
    font-family:"Times New Roman", Times, Georgia, serif;
  }
  .arcade-scene{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#2d2d2a;
    isolation:isolate;
    touch-action:none;
  }
  .arcade-frame{
    position:absolute;
    left:50%;
    top:50%;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16 / 9;
    transform:translate(-50%, -50%);
    transform-origin:center;
  }
  .arcade-bg,
  .arcade-prize-strip,
  .arcade-front,
  .arcade-coin-mouth,
  .arcade-layer,
  .arcade-control{
    position:absolute;
  }
  .arcade-bg{
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    z-index:1;
  }
  .arcade-layer{
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
    pointer-events:none;
  }
  #game-canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:auto;
    contain:strict;
  }
  .arcade-front{
    left:9.9609375%;
    top:3.125%;
    width:81.6015625%;
    height:auto;
    z-index:4;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-prize-strip{
    left:10.8203125%;
    top:59.8611111111%;
    width:76.9140625%;
    height:auto;
    z-index:2;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-brand-hit{
    position:absolute;
    left:26%;
    top:7%;
    width:48%;
    height:14%;
    z-index:5;
    text-indent:-999px;
    overflow:hidden;
  }
  .arcade-status{
    position:absolute;
    left:50%;
    top:80.2%;
    z-index:6;
    min-width:clamp(74px, 7vw, 136px);
    padding:.12em .35em;
    transform:translate(-50%, -50%);
    color:#f20b06;
    text-align:center;
    font:bold clamp(11px, .92vw, 17px)/1.05 "Courier New", monospace;
    background:rgba(0,0,0,.22);
    text-shadow:0 2px 0 #000;
    letter-spacing:.06em;
    pointer-events:none;
  }
  .arcade-status.is-done{
    animation:arcadeBlink .78s steps(2, end) infinite;
  }
  .arcade-status:empty{
    display:none;
  }
  .arcade-handle-zone{
    left:42.55%;
    top:70.85%;
    width:7.1%;
    height:8.4%;
    z-index:7;
    cursor:grab;
    touch-action:none;
  }
  .arcade-handle-zone:active{
    cursor:grabbing;
  }
  .arcade-handle{
    position:absolute;
    left:58%;
    bottom:0;
    width:35.2%;
    transform:translate(calc(-50% + var(--joy-x, 0px)), 0);
    transform-origin:50% 90%;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.7));
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-button{
    left:53.125%;
    top:77.7%;
    width:2.46%;
    z-index:7;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    touch-action:manipulation;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.7));
  }
  .arcade-button::before,
  .arcade-coin-slot::before{
    content:"";
    position:absolute;
    inset:-90%;
  }
  .arcade-button img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-button .arcade-button__pressed{
    display:none;
  }
  .arcade-button.is-pressed .arcade-button__idle{
    display:none;
  }
  .arcade-button.is-pressed .arcade-button__pressed{
    display:block;
    transform:translateY(5%);
  }
  .arcade-coin-slot{
    left:48.45%;
    top:82.35%;
    width:6.3%;
    height:10.8%;
    z-index:8;
    padding:0;
    border:0;
    border-radius:42%;
    background:transparent;
    cursor:pointer;
    opacity:0;
    touch-action:manipulation;
  }
  .arcade-coin-slot:disabled{
    cursor:default;
    pointer-events:none;
  }
  .arcade-coin-mouth{
    left:50.35%;
    top:88.45%;
    width:1.25%;
    height:4.2%;
    z-index:8;
    transform:translate(-50%, -50%);
    pointer-events:none;
  }
  .arcade-coin{
    position:absolute;
    left:50.35%;
    top:88.45%;
    width:1.25%;
    height:auto;
    z-index:9;
    display:block;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.7));
    transform:translate(-50%, -50%);
    will-change:transform, opacity;
    pointer-events:none;
    animation:arcadeCoinDeposit .48s ease-in forwards;
  }
  .arcade-sr{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  @keyframes arcadeBlink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:.35; }
  }
  @keyframes arcadeCoinDeposit{
    0%{ transform:translate(-50%, -50%) scale(1) rotate(-7deg); opacity:1; }
    100%{ transform:translate(-50%, -50%) scale(.2) rotate(90deg); opacity:0; }
  }
  @media (max-aspect-ratio:16 / 9){
    .arcade-frame{
      width:100vw;
    }
  }
  @media (min-aspect-ratio:16 / 9){
    .arcade-frame{
      width:calc(100vh * 16 / 9);
    }
  }
  @media (max-width:820px){
    .arcade-frame{
      width:max(128vw, calc(100vh * 16 / 9));
    }
    .arcade-status{
      font-size:12px;
    }
  }
  @media (max-width:480px){
    .arcade-frame{
      left:52%;
      width:max(190vw, calc(100vh * 16 / 9));
    }
    .arcade-button{
      width:3.75%;
    }
    .arcade-handle-zone{
      width:5.9%;
    }
  }
  @media (prefers-reduced-motion: reduce){
    .arcade-status.is-done{
      animation:none;
    }
  }
</style>
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <main class="arcade-scene" aria-label="Beckwards claw machine arcade">
    <div class="arcade-frame" id="arcade-frame">
      <img class="arcade-bg" src="assets/claw-machine/background.webp" alt="" aria-hidden="true" />
      <a class="arcade-brand-hit" href="/" aria-label="Home">Beckwards</a>
      <img class="arcade-prize-strip" src="assets/claw-machine/prizes.webp" alt="" aria-hidden="true" />
      <div class="arcade-layer" id="stage" aria-label="Game stage">
        <span class="arcade-sr">Loading claw machine...</span>
      </div>
      <img class="arcade-front" src="assets/claw-machine/front%20layer.webp" alt="" aria-hidden="true" />
      <p class="arcade-status" id="arcade-status" role="status" aria-live="polite">ONE TRY</p>
      <div class="arcade-control arcade-handle-zone" id="gate" aria-label="Joystick area">
        <img class="arcade-handle" id="joy" src="assets/claw-machine/handle.png" alt="Joystick" role="slider" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" />
      </div>
      <button type="button" class="arcade-control arcade-button" id="btn-drop" aria-label="Drop claw">
        <img class="arcade-button__idle" src="assets/claw-machine/button%20unpressed.png" alt="" aria-hidden="true" />
        <img class="arcade-button__pressed" src="assets/claw-machine/button%20pressed.png" alt="" aria-hidden="true" />
      </button>
      <span class="arcade-coin-mouth" id="coin-mouth" aria-hidden="true"></span>
      <button type="button" class="arcade-control arcade-coin-slot" id="coin-slot" aria-label="Insert coin to retry" disabled></button>
    </div>
  </main>

  <div class="reward-modal" id="reward-modal" role="dialog" aria-modal="true" aria-label="Your reward" hidden>
    <div class="reward-modal__scrim" data-reward-close aria-hidden="true"></div>
    <div class="reward-modal__coin-layer" aria-hidden="true"></div>
    <section class="reward-modal__panel" id="reward-panel" tabindex="-1">
      <div class="reward-modal__image-wrap">
        <a class="reward-modal__image-link" id="reward-link">
          <img class="reward-modal__image" id="reward-image" decoding="async" alt="Reward" hidden />
        </a>
      </div>
      <div class="reward-modal__actions">
        <a class="reward-modal__button reward-modal__download" id="reward-download" href="#" download hidden>Download</a>
        <button class="reward-modal__button reward-modal__back" type="button" data-reward-close>Back</button>
      </div>
    </section>
  </div>

  <script type="module" src="scripts/game.js"></script>
  <script type="module" src="scripts/arcade-controls.js"></script>
</body>
</html>
