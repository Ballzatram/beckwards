<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live - Beckwards</title>
  <link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="poster-page poster-live">
  <main class="poster-scene" aria-label="Live Beckwards">
    <a class="poster-logo" href="/" aria-label="Home">
      <img src="assets/live/Beckwards.png" alt="Beckwards" />
    </a>
    <img class="poster-note" src="assets/live/no%20shows%20scheduled.png" alt="No shows scheduled at this time" />
  </main>
</body>
</html>
