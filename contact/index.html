<!doctype html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Beckwards</title>
  <link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="poster-page poster-contact">
  <main class="poster-scene" aria-label="Contact Beckwards">
    <a class="poster-logo" href="/" aria-label="Home">
      <img src="assets/contact/Beckwards.png" alt="Beckwards" />
    </a>
    <img class="poster-callout poster-contact-callout" src="assets/contact/take%20tab%20to%20copy.png" alt="Take tab to copy" />

    <section class="contact-tabs" aria-label="Pull a tab to copy contact details">
      <button class="contact-tab contact-tab--1" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%201.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--2" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%202.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--3" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%203.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--4" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%204.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--5" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%205.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--6" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%206.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--7" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%207.png" alt="" aria-hidden="true" />
      </button>
      <button class="contact-tab contact-tab--8" type="button" data-contact-tab aria-label="Copy beckwardss@gmail.com">
        <img src="assets/contact/tab%208.png" alt="" aria-hidden="true" />
      </button>
    </section>

    <p class="poster-status" id="copy-status" role="status" aria-live="polite" aria-atomic="true">
      <img class="poster-copied" src="assets/contact/copied_.png" alt="" aria-hidden="true" />
      <span class="poster-status-text" data-copy-status-text></span>
    </p>
  </main>

  <script>
    (() => {
      const EMAIL = 'beckwardss@gmail.com';
      const scene = document.querySelector('.poster-scene');
      const status = document.getElementById('copy-status');
      const statusText = document.querySelector('[data-copy-status-text]');
      const copiedImage = document.querySelector('.poster-copied');
      const tabs = Array.from(document.querySelectorAll('[data-contact-tab]'));
      const tearSoundUrls = Array.from({ length: 6 }, (_, index) => `assets/contact/tear%20${index + 1}.wav`);

      const playTearSound = () => {
        const source = tearSoundUrls[Math.floor(Math.random() * tearSoundUrls.length)];
        if (!source) return;
        try {
          const sound = new Audio(source);
          sound.preload = 'none';
          sound.volume = 0.72;
          sound.play().catch(() => {});
        } catch (_) {}
      };

      const writeClipboardFallback = (text) => {
        const input = document.createElement('textarea');
        input.value = text;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        input.style.top = '0';
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand('copy');
        } finally {
          input.remove();
        }
      };

      const copyEmail = async (tab) => {
        if (tab.dataset.copied === 'true') return;
        const shouldMoveFocus = document.activeElement === tab;
        tab.dataset.copied = 'true';
        tab.classList.remove('is-dragging');
        tab.classList.add('is-removed');
        tab.style.opacity = '0';
        tab.style.visibility = 'hidden';
        tab.style.pointerEvents = 'none';
        tab.tabIndex = -1;
        tab.setAttribute('aria-hidden', 'true');
        if (shouldMoveFocus) {
          const nextTab = tabs.find((candidate) => candidate !== tab && candidate.dataset.copied !== 'true');
          nextTab?.focus({ preventScroll:true });
        }
        playTearSound();
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(EMAIL);
          } else {
            writeClipboardFallback(EMAIL);
          }
          status.classList.add('is-visible');
          statusText.textContent = 'copied';
          copiedImage.style.opacity = '1';
          copiedImage.style.transform = 'scale(1)';
        } catch (_) {
          writeClipboardFallback(EMAIL);
          status.classList.add('is-visible');
          statusText.textContent = 'copied';
          copiedImage.style.opacity = '1';
          copiedImage.style.transform = 'scale(1)';
        }
      };

      const setTabPosition = (tab, x, y) => {
        const sceneRect = scene.getBoundingClientRect();
        tab.style.left = `${x - sceneRect.left}px`;
        tab.style.top = `${y - sceneRect.top}px`;
        tab.style.right = 'auto';
        tab.style.bottom = 'auto';
      };

      tabs.forEach((tab) => {
        tab.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          copyEmail(tab);
        });

        tab.addEventListener('pointerdown', (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          event.preventDefault();
          const pointerId = event.pointerId;
          const startX = event.clientX;
          const startY = event.clientY;
          let lastX = startX;
          let lastY = startY;
          const tabRect = tab.getBoundingClientRect();
          const offsetX = event.clientX - (tabRect.left + tabRect.width / 2);
          const offsetY = event.clientY - (tabRect.top + tabRect.height / 2);
          const threshold = window.matchMedia('(pointer: coarse)').matches ? 84 : window.matchMedia('(max-width: 640px)').matches ? 96 : 140;

          const restoreTabPosition = () => {
            if (tab.dataset.copied === 'true') return;
            ['left', 'top', 'right', 'bottom'].forEach((property) => tab.style.removeProperty(property));
          };

          tab.classList.add('is-dragging');
          tab.setPointerCapture?.(pointerId);
          setTabPosition(tab, event.clientX - offsetX, event.clientY - offsetY);

          const moveTab = (moveEvent) => {
            if (moveEvent.pointerId !== pointerId) return;
            lastX = moveEvent.clientX;
            lastY = moveEvent.clientY;
            const nextX = moveEvent.clientX - offsetX;
            const nextY = moveEvent.clientY - offsetY;
            setTabPosition(tab, nextX, nextY);

            const distance = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
            if (distance >= threshold) {
              copyEmail(tab);
            }
          };

          const endDrag = (upEvent) => {
            if (upEvent.pointerId !== pointerId) return;
            lastX = upEvent.clientX;
            lastY = upEvent.clientY;
            try { tab.releasePointerCapture?.(pointerId); } catch (_) {}
            tab.removeEventListener('pointermove', moveTab);
            tab.removeEventListener('pointerup', endDrag);
            tab.removeEventListener('pointercancel', cancelDrag);
            tab.classList.remove('is-dragging');
            const distance = Math.hypot(lastX - startX, lastY - startY);
            if (distance < 10) copyEmail(tab);
            else if (distance < threshold) restoreTabPosition();
          };

          const cancelDrag = () => {
            tab.removeEventListener('pointermove', moveTab);
            tab.removeEventListener('pointerup', endDrag);
            tab.removeEventListener('pointercancel', cancelDrag);
            tab.classList.remove('is-dragging');
            try { tab.releasePointerCapture?.(pointerId); } catch (_) {}
            restoreTabPosition();
          };

          tab.addEventListener('pointermove', moveTab);
          tab.addEventListener('pointerup', endDrag);
          tab.addEventListener('pointercancel', cancelDrag);
        });
      });
    })();
  </script>
</body>
</html>
