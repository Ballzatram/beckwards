<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcade - Beckwards</title>
<link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
<link rel="stylesheet" href="style.css" />
<style>
  html,
  body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
    background:#2d2d2a;
  }
  body{
    overflow:hidden;
    color:#f20b06;
    font-family:"Times New Roman", Times, Georgia, serif;
  }
  .arcade-scene{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#2d2d2a;
    isolation:isolate;
    touch-action:none;
  }
  .arcade-frame{
    position:absolute;
    left:50%;
    top:50%;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16 / 9;
    transform:translate(-50%, -50%);
    transform-origin:center;
  }
  .arcade-bg,
  .arcade-layer,
  .arcade-control{
    position:absolute;
  }
  .arcade-bg{
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    z-index:1;
  }
  .arcade-layer{
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
  }
  .arcade-brand-hit{
    position:absolute;
    left:26%;
    top:7%;
    width:48%;
    height:14%;
    z-index:4;
    text-indent:-999px;
    overflow:hidden;
  }
  .arcade-status{
    position:absolute;
    left:50%;
    top:80.2%;
    z-index:5;
    min-width:clamp(74px, 7vw, 136px);
    padding:.12em .35em;
    transform:translate(-50%, -50%);
    color:#f20b06;
    text-align:center;
    font:bold clamp(11px, .92vw, 17px)/1.05 "Courier New", monospace;
    background:rgba(0,0,0,.22);
    text-shadow:0 2px 0 #000;
    letter-spacing:.06em;
    pointer-events:none;
  }
  .arcade-status.is-done{
    animation:arcadeBlink .78s steps(2, end) infinite;
  }
  .arcade-status:empty{
    display:none;
  }
  .arcade-handle-zone{
    left:43.58%;
    top:71.8%;
    width:5%;
    height:6.67%;
    z-index:6;
    cursor:grab;
    touch-action:none;
  }
  .arcade-handle-zone:active{
    cursor:grabbing;
  }
  .arcade-handle{
    position:absolute;
    left:50%;
    bottom:0;
    width:35.2%;
    transform:translate(calc(-50% + var(--joy-x, 0px)), 0);
    transform-origin:50% 90%;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.7));
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-button{
    left:53.125%;
    top:77.7%;
    width:2.46%;
    z-index:6;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    touch-action:manipulation;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.7));
  }
  .arcade-button img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .arcade-button__pressed{
    display:none;
  }
  .arcade-button.is-pressed .arcade-button__idle{
    display:none;
  }
  .arcade-button.is-pressed .arcade-button__pressed{
    display:block;
    transform:translateY(5%);
  }
  .arcade-coin-slot{
    left:49.2%;
    top:83.15%;
    width:4.8%;
    height:9.2%;
    z-index:7;
    padding:0;
    border:0;
    border-radius:42%;
    background:transparent;
    cursor:pointer;
    opacity:0;
    touch-action:manipulation;
  }
  .arcade-coin-slot:disabled{
    cursor:default;
    pointer-events:none;
  }
  .arcade-coin{
    position:absolute;
    left:50.45%;
    top:72.9%;
    width:2.4%;
    aspect-ratio:1;
    z-index:8;
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%, #fff7ba, #d1a32d 55%, #785313);
    border:2px solid rgba(0,0,0,.45);
    box-shadow:0 3px 4px rgba(0,0,0,.6);
    transform:translate(-50%, -50%);
    pointer-events:none;
    animation:arcadeCoinDrop .82s cubic-bezier(.26,.7,.3,1) forwards;
  }
  .arcade-sr{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  @keyframes arcadeBlink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:.35; }
  }
  @keyframes arcadeCoinDrop{
    0%{ transform:translate(-50%, -50%) scale(1) rotate(0deg); opacity:1; }
    72%{ transform:translate(-50%, 108%) scale(.82) rotate(94deg); opacity:1; }
    100%{ transform:translate(-50%, 145%) scale(.42) rotate(128deg); opacity:0; }
  }
  @media (max-aspect-ratio:16 / 9){
    .arcade-frame{
      width:100vw;
    }
  }
  @media (min-aspect-ratio:16 / 9){
    .arcade-frame{
      width:calc(100vh * 16 / 9);
    }
  }
  @media (max-width:820px){
    .arcade-frame{
      width:max(100vw, calc(100vh * 16 / 9));
    }
    .arcade-status{
      font-size:12px;
    }
  }
  @media (max-width:480px){
    .arcade-frame{
      left:50%;
      width:max(178vw, calc(100vh * 16 / 9));
    }
    .arcade-button{
      width:3.75%;
    }
    .arcade-handle-zone{
      width:5.9%;
    }
  }
  @media (prefers-reduced-motion: reduce){
    .arcade-status.is-done{
      animation:none;
    }
  }
</style>
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <main class="arcade-scene" aria-label="Beckwards claw machine arcade">
    <div class="arcade-frame" id="arcade-frame">
      <img class="arcade-bg" src="assets/claw-machine/background.png" alt="" aria-hidden="true" />
      <a class="arcade-brand-hit" href="/" aria-label="Home">Beckwards</a>
      <div class="arcade-layer" id="stage" aria-label="Game stage">
        <span class="arcade-sr">Loading claw machine...</span>
      </div>
      <p class="arcade-status" id="arcade-status" role="status" aria-live="polite">ONE TRY</p>
      <div class="arcade-control arcade-handle-zone" id="gate" aria-label="Joystick area">
        <img class="arcade-handle" id="joy" src="assets/claw-machine/handle.png" alt="Joystick" role="slider" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" />
      </div>
      <button type="button" class="arcade-control arcade-button" id="btn-drop" aria-label="Drop claw">
        <img class="arcade-button__idle" src="assets/claw-machine/button%20pressed.png" alt="" aria-hidden="true" />
        <img class="arcade-button__pressed" src="assets/claw-machine/button%20pressed.png" alt="" aria-hidden="true" />
      </button>
      <button type="button" class="arcade-control arcade-coin-slot" id="coin-slot" aria-label="Insert coin to retry" disabled></button>
    </div>
  </main>

  <script type="module" src="scripts/game.js"></script>
  <script>
    (() => {
      const knob = document.getElementById('joy');
      const gate = document.getElementById('gate');
      const button = document.getElementById('btn-drop');
      if (!knob || !gate || !button) return;

      const setKnob = (x) => {
        const rect = gate.getBoundingClientRect();
        const max = Math.max(8, rect.width * 0.26);
        const clamped = Math.max(-max, Math.min(max, x));
        gate.style.setProperty('--joy-x', `${clamped}px`);
        knob.setAttribute('aria-valuenow', (clamped / max).toFixed(2));
        return clamped / max;
      };

      let dragging = false;
      let lastDir = 0;
      let raf = null;
      let currentRatio = 0;

      const dirFromRatio = (ratio) => {
        if (ratio <= -0.26) return -1;
        if (ratio >= 0.26) return 1;
        return 0;
      };

      const updateMove = () => {
        const dir = dirFromRatio(currentRatio);
        if (dir !== lastDir) {
          if (dir < 0) window.GAME?.moveLeft();
          else if (dir > 0) window.GAME?.moveRight();
          else window.GAME?.stopMove();
          lastDir = dir;
        }
        raf = requestAnimationFrame(updateMove);
      };

      const move = (event) => {
        if (!dragging) return;
        const point = event.touches ? event.touches[0] : event;
        const rect = gate.getBoundingClientRect();
        currentRatio = setKnob(point.clientX - (rect.left + rect.width / 2));
      };

      const stop = () => {
        dragging = false;
        currentRatio = 0;
        setKnob(0);
        window.GAME?.stopMove();
        lastDir = 0;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('touchmove', move);
      };

      const start = (event) => {
        event.preventDefault();
        dragging = true;
        move(event);
        if (!raf) raf = requestAnimationFrame(updateMove);
        window.addEventListener('pointermove', move, { passive:false });
        window.addEventListener('pointerup', stop, { passive:false, once:true });
        window.addEventListener('pointercancel', stop, { passive:false, once:true });
        window.addEventListener('touchmove', move, { passive:false });
        window.addEventListener('touchend', stop, { passive:false, once:true });
      };

      gate.addEventListener('pointerdown', start, { passive:false });
      gate.addEventListener('touchstart', start, { passive:false });

      const pressDrop = (event) => {
        event.preventDefault();
        button.classList.add('is-pressed');
        window.GAME?.drop();
      };
      const releaseDrop = () => {
        button.classList.remove('is-pressed');
      };

      button.addEventListener('pointerdown', pressDrop, { passive:false });
      button.addEventListener('pointerup', releaseDrop);
      button.addEventListener('pointerleave', releaseDrop);
      button.addEventListener('pointercancel', releaseDrop);
    })();
  </script>
</body>
</html>
