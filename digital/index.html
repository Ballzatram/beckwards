<!doctype html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who is B3000? - Beckwards</title>
  <meta name="description" content="Who is B3000? A Beckwards collage and note." />
  <link rel="icon" type="image/png" href="assets/thumbnails/1.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      let cleanPath = location.pathname;
      if (cleanPath.endsWith("/index.html")) {
        cleanPath = cleanPath.slice(0, -"index.html".length);
      } else if (cleanPath.endsWith(".html")) {
        cleanPath = cleanPath.slice(0, -".html".length);
      }
      if (cleanPath !== location.pathname) {
        location.replace(location.origin + cleanPath + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="who-page">
  <main class="who-scene" data-who-scene aria-label="Who is B3000?">
    <div class="who-art" data-who-art>
      <img class="who-piece who-piece--secret" src="assets/who-is-b3/you'll%20poke%20holes%20in%20anything.png" alt="" aria-hidden="true" />
      <img class="who-piece who-piece--photo who-piece--photo-left" src="assets/who-is-b3/picture%203.png" alt="B3000 robot portrait" />
      <img class="who-piece who-piece--photo who-piece--photo-bottom" src="assets/who-is-b3/picture%202.png" alt="B3000 robot in front of hills" />
      <img class="who-piece who-piece--photo who-piece--photo-right" src="assets/who-is-b3/picture%201.png" alt="B3000 robot standing beside Becket" />
      <img class="who-piece who-piece--note" src="assets/who-is-b3/updated%20Who%20is%20B3000.png" alt="Who is B3000? handwritten note by Becket" />
    </div>

    <a class="who-home-link" href="/" aria-label="Home">
      <img src="assets/who-is-b3/house%20drawing/house%20drawing.png" alt="" aria-hidden="true" />
    </a>

    <div class="who-magnifier" data-who-magnifier role="button" tabindex="0" aria-disabled="true" aria-label="Drag the magnifying glass to magnify the page and reveal hidden writing">
      <div class="who-lens" data-who-lens aria-hidden="true">
        <div class="who-lens-content" data-who-lens-content></div>
      </div>
      <img class="who-magnifier__image" src="assets/who-is-b3/magnifying%20glass.png" alt="" aria-hidden="true" />
      <span class="who-secret-callout">open secret page</span>
    </div>
  </main>

  <script>
    (() => {
      const scene = document.querySelector('[data-who-scene]');
      const art = document.querySelector('[data-who-art]');
      const magnifier = document.querySelector('[data-who-magnifier]');
      const lens = document.querySelector('[data-who-lens]');
      const lensContent = document.querySelector('[data-who-lens-content]');
      if (!scene || !art || !magnifier || !lens || !lensContent) return;

      const zoom = 1.74;
      const unlockKey = 'beckwardsInfiniteJestUnlocked';
      const secret = art.querySelector('.who-piece--secret');
      let unlocked = false;
      let revealActive = false;
      let sceneRect = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let centerX = 0;
      let centerY = 0;
      let pointerStartX = 0;
      let pointerStartY = 0;
      let dragged = false;

      const clone = art.cloneNode(true);
      clone.removeAttribute('data-who-art');
      clone.setAttribute('aria-hidden', 'true');
      clone.classList.add('who-art--magnified');
      lensContent.appendChild(clone);

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const hasSessionUnlock = () => {
        try {
          return window.sessionStorage?.getItem(unlockKey) === 'true';
        } catch (_) {
          return false;
        }
      };

      const writeSessionUnlock = () => {
        try {
          window.sessionStorage?.setItem(unlockKey, 'true');
        } catch (_) {}
      };

      const setUnlocked = () => {
        if (unlocked) return;
        unlocked = true;
        writeSessionUnlock();
        magnifier.classList.add('is-unlocked');
      };

      const setRevealActive = (active) => {
        revealActive = active;
        magnifier.classList.toggle('is-reveal-active', active);
        magnifier.setAttribute('aria-disabled', active ? 'false' : 'true');
        if (active) {
          magnifier.setAttribute('aria-label', 'Open secret page');
          magnifier.title = 'Open secret page';
          return;
        }
        magnifier.setAttribute('aria-label', unlocked ? 'Drag the magnifying glass back over the hidden writing to open the Infinite Jest page' : 'Drag the magnifying glass to magnify the page and reveal hidden writing');
        magnifier.removeAttribute('title');
      };

      const openSecretPage = () => {
        if (!unlocked || !revealActive) return;
        window.location.href = '/infinite-jest';
      };

      const lensCenteredOnSecret = (lensRect, secretRect) => {
        const lensCenterX = lensRect.left + lensRect.width / 2;
        const lensCenterY = lensRect.top + lensRect.height / 2;
        const insetX = secretRect.width * 0.12;
        const insetY = secretRect.height * 0.18;
        return lensCenterX >= secretRect.left + insetX
          && lensCenterX <= secretRect.right - insetX
          && lensCenterY >= secretRect.top + insetY
          && lensCenterY <= secretRect.bottom - insetY;
      };

      const checkReveal = () => {
        const active = !!secret && lensCenteredOnSecret(lens.getBoundingClientRect(), secret.getBoundingClientRect());
        setRevealActive(active);
        if (active && !unlocked) {
          setUnlocked();
        }
      };

      const readCenter = () => {
        sceneRect = scene.getBoundingClientRect();
        const rect = magnifier.getBoundingClientRect();
        centerX = rect.left + rect.width / 2 - sceneRect.left;
        centerY = rect.top + rect.height / 2 - sceneRect.top;
      };

      const updateLens = () => {
        sceneRect = scene.getBoundingClientRect();
        const lensRect = lens.getBoundingClientRect();
        const lensCenterX = lensRect.left + lensRect.width / 2 - sceneRect.left;
        const lensCenterY = lensRect.top + lensRect.height / 2 - sceneRect.top;
        lensContent.style.width = `${sceneRect.width}px`;
        lensContent.style.height = `${sceneRect.height}px`;
        lensContent.style.transform = `translate(${(lensRect.width / 2) - (lensCenterX * zoom)}px, ${(lensRect.height / 2) - (lensCenterY * zoom)}px) scale(${zoom})`;
        checkReveal();
      };

      const setCenter = (x, y) => {
        sceneRect = scene.getBoundingClientRect();
        const rect = magnifier.getBoundingClientRect();
        const marginX = rect.width * 0.18;
        const marginY = rect.height * 0.18;
        centerX = clamp(x, -marginX, sceneRect.width + marginX);
        centerY = clamp(y, -marginY, sceneRect.height + marginY);
        magnifier.style.left = `${centerX}px`;
        magnifier.style.top = `${centerY}px`;
        updateLens();
      };

      const startDrag = (event) => {
        event.preventDefault();
        readCenter();
        pointerStartX = event.clientX;
        pointerStartY = event.clientY;
        dragged = false;
        dragOffsetX = event.clientX - (sceneRect.left + centerX);
        dragOffsetY = event.clientY - (sceneRect.top + centerY);
        magnifier.classList.add('is-dragging');
        magnifier.setPointerCapture?.(event.pointerId);
        magnifier.focus?.({ preventScroll: true });
      };

      const moveDrag = (event) => {
        if (!magnifier.classList.contains('is-dragging')) return;
        if (Math.hypot(event.clientX - pointerStartX, event.clientY - pointerStartY) > 5) {
          dragged = true;
        }
        sceneRect = scene.getBoundingClientRect();
        setCenter(event.clientX - sceneRect.left - dragOffsetX, event.clientY - sceneRect.top - dragOffsetY);
      };

      const stopDrag = (event) => {
        const shouldActivate = event?.type === 'pointerup' && !dragged && unlocked && revealActive;
        magnifier.classList.remove('is-dragging');
        if (event?.pointerId != null) magnifier.releasePointerCapture?.(event.pointerId);
        if (shouldActivate) openSecretPage();
      };

      magnifier.addEventListener('pointerdown', startDrag);
      magnifier.addEventListener('pointermove', moveDrag);
      magnifier.addEventListener('pointerup', stopDrag);
      magnifier.addEventListener('pointercancel', stopDrag);
      magnifier.addEventListener('click', (event) => {
        if (!unlocked || !revealActive || dragged) return;
        event.preventDefault();
        openSecretPage();
      });
      magnifier.addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && unlocked && revealActive) {
          event.preventDefault();
          openSecretPage();
          return;
        }
        const keyMap = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1]
        };
        const direction = keyMap[event.key];
        if (!direction) return;
        event.preventDefault();
        if (!sceneRect) readCenter();
        const step = event.shiftKey ? 38 : 16;
        setCenter(centerX + direction[0] * step, centerY + direction[1] * step);
      });

      window.addEventListener('resize', () => {
        readCenter();
        setCenter(centerX, centerY);
      });

      requestAnimationFrame(() => {
        if (hasSessionUnlock()) setUnlocked();
        readCenter();
        setCenter(centerX, centerY);
      });
    })();
  </script>
</body>
</html>
